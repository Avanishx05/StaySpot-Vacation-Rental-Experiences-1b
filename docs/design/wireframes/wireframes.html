<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StaySpot Wireframes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ---------- Design tokens (mirrors web/src/theme.js) ---------- */
:root {
  --ink: #12302C;        /* text: deep pine ink */
  --forest-700: #133A35; /* pine dark: nav, hover */
  --forest-600: #1E4D47; /* pine: primary, hero panels */
  --forest-100: #DDF5E8; /* mint light: tinted surfaces, selected rows */
  --sand-50:  #F3F7F5;   /* page background: mist */
  --gold-400: #5FD39A;   /* mint: accent, highlights, live, nav pill */
  --star: #F2B544;       /* star gold: ratings only */
  --wood-100: #FDF0D5;   /* amber light: CHECKED_IN */
  --lake-600: #2E8FB8;   /* pool blue: info, CONFIRMED, data marks */
  --lake-100: #E1F1F8;
  --wood-600: #5FD39A;   /* accent button = mint */
  --white: #FFFFFF;
  --gray-600: #5D716D;   /* secondary text */
  --gray-300: #D3E0DB;   /* borders */
  --gray-200: #E3ECE8;
  --ok-600: #1E8F5E;  --ok-100: #E3F6EC;
  --red-600:   #C2412F;  --red-100:   #FCEBE7;
  --radius: 14px;
  --radius-sm: 8px;
  --shadow: 0 1px 2px rgba(18,48,44,.06), 0 8px 24px rgba(18,48,44,.08);
  --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --display: "Outfit", "Inter", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: #DCE6E2; font-family: var(--font); color: var(--ink); font-size: 14px; line-height: 1.45; }
.sheet { max-width: 1360px; margin: 0 auto; padding: 32px 24px 80px; }
.sheet > h1 { font-size: 26px; margin: 0 0 4px; }
.sheet > p.lead { color: var(--gray-600); margin: 0 0 28px; }
.label { font-size: 13px; font-weight: 600; color: var(--gray-600); text-transform: uppercase; letter-spacing: .06em; margin: 36px 0 10px; }
.label span { text-transform: none; letter-spacing: 0; font-weight: 400; }

/* ---------- Browser frame ---------- */
.frame { background: var(--sand-50); border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(18,48,44,.15); width: 1280px; container-type: inline-size; }
.frame.phone { width: 390px; border-radius: 28px; border: 10px solid #12302C; }
.chrome { height: 34px; background: #E9F0ED; display: flex; align-items: center; gap: 6px; padding: 0 14px; border-bottom: 1px solid var(--gray-300); }
.chrome i { width: 11px; height: 11px; border-radius: 50%; background: #C9D8D2; display: block; }
.chrome .url { margin-left: 14px; background: #fff; border-radius: 6px; padding: 3px 12px; font-size: 12px; color: var(--gray-600); flex: 1; max-width: 520px; font-family: var(--mono); }
.phone .chrome { height: 26px; justify-content: center; }
.phone .chrome i { display: none; }
.phone .chrome .url { margin: 0; flex: 0 1 220px; text-align: center; font-size: 11px; padding: 2px 8px; }

/* ---------- App shell ---------- */
.topnav { background: var(--white); border-bottom: 1px solid var(--gray-300); height: 60px; display: flex; align-items: center; padding: 0 28px; gap: 28px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 18px; color: var(--ink); }
.brand .mark { width: 28px; height: 28px; border-radius: 8px; background: var(--forest-600); position: relative; }
.brand .mark::after { content: ""; position: absolute; width: 11px; height: 11px; border-radius: 50%; background: var(--gold-400); right: 5px; top: 5px; }
.navlinks { display: flex; gap: 4px; flex: 1; }
.navlinks a { padding: 8px 12px; border-radius: var(--radius-sm); color: var(--gray-600); font-weight: 500; text-decoration: none; }
.navlinks a.on { color: var(--forest-700); background: var(--forest-100); box-shadow: inset 0 -2px 0 var(--gold-400); }
.actor { display: flex; align-items: center; gap: 10px; border: 1px solid var(--gray-300); border-radius: 999px; padding: 4px 12px 4px 4px; background: var(--white); }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--gold-400); color: var(--ink); display: grid; place-items: center; font-weight: 700; font-size: 12px; }
.actor small { display: block; color: var(--gray-600); font-size: 11px; line-height: 1.1; }
.actor b { font-size: 13px; line-height: 1.1; }
.actor .chev { color: var(--gray-600); margin-left: 4px; }
.burger { display: none; width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--gray-300); place-items: center; }
.burger span { display: block; width: 16px; height: 2px; background: var(--ink); box-shadow: 0 5px 0 var(--ink), 0 -5px 0 var(--ink); }

.page { padding: 28px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
.page-head h2 { margin: 0; font-size: 24px; }
.page-head p { margin: 4px 0 0; color: var(--gray-600); }
.crumbs { font-size: 13px; color: var(--gray-600); margin-bottom: 6px; }
.crumbs a { color: var(--forest-600); text-decoration: none; }

/* ---------- Components ---------- */
.card { background: var(--white); border: 1px solid var(--gray-300); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-h { padding: 16px 20px; border-bottom: 1px solid var(--gray-200); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.card-h h3 { margin: 0; font-size: 16px; }
.card-h .sub { color: var(--gray-600); font-size: 12px; }
.card-b { padding: 20px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 38px; padding: 0 16px; border-radius: var(--radius-sm); font: 600 14px var(--font); border: 1px solid transparent; cursor: pointer; white-space: nowrap; }
.btn-primary { background: var(--forest-600); color: #fff; }
.btn-secondary { background: #fff; color: var(--forest-700); border-color: var(--gray-300); }
.btn-accent { background: var(--gold-400); color: var(--forest-700); }
.btn-ghost { background: transparent; color: var(--forest-600); padding: 0 8px; }
.btn-danger { background: #fff; color: var(--red-600); border-color: #EBB8AF; }
.btn-sm { height: 30px; padding: 0 12px; font-size: 13px; }
.btn[disabled] { opacity: .5; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: 12px; font-weight: 600; color: var(--gray-600); }
.input { height: 38px; border: 1px solid var(--gray-300); border-radius: var(--radius-sm); background: #fff; padding: 0 12px; display: flex; align-items: center; gap: 8px; color: var(--ink); min-width: 0; }
.input.ph { color: #93A6A1; }
.input.sel::after { content: "▾"; margin-left: auto; color: var(--gray-600); font-size: 11px; }
.input.focus { border-color: var(--forest-600); box-shadow: 0 0 0 3px var(--forest-100); }
.filters { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; padding: 16px 20px; border-bottom: 1px solid var(--gray-200); }
.tabs { display: flex; gap: 2px; background: var(--forest-100); padding: 4px; border-radius: 8px; }
.tabs a { padding: 6px 14px; border-radius: 6px; color: var(--forest-700); font-weight: 500; text-decoration: none; }
.tabs a.on { background: #fff; color: var(--ink); font-weight: 600; box-shadow: var(--shadow); }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; font-weight: 600; color: var(--gray-600); text-transform: uppercase; letter-spacing: .04em; padding: 10px 20px; background: var(--sand-50); border-bottom: 1px solid var(--gray-200); white-space: nowrap; }
td { padding: 12px 20px; border-bottom: 1px solid var(--gray-200); white-space: nowrap; }
tr.hover td { background: var(--forest-100); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 12px; color: var(--gray-600); }
.pager { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; color: var(--gray-600); font-size: 13px; }
.pager .pages { display: flex; gap: 4px; }
.pager .pages b, .pager .pages span { min-width: 30px; height: 30px; border-radius: 6px; display: grid; place-items: center; border: 1px solid var(--gray-300); background: #fff; font-weight: 500; color: var(--ink); }
.pager .pages b { background: var(--forest-600); color: #fff; border-color: var(--forest-600); }
.badge { white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .03em; }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.b-confirmed { background: var(--lake-100); color: #245A75; }
.b-checkedin { background: var(--wood-100); color: #8A5A12; }
.b-completed { background: #E3ECE8; color: #5E5448; }
.b-debit { background: var(--red-100); color: var(--red-600); }
.b-credit { background: var(--ok-100); color: var(--ok-600); }
.pos { color: var(--ok-600); font-weight: 600; }
.neg { color: var(--red-600); font-weight: 600; }
.alert { display: flex; gap: 12px; padding: 14px 16px; border-radius: var(--radius-sm); border: 1px solid; }
.alert .ic { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; color: #fff; }
.alert b { display: block; margin-bottom: 2px; }
.alert p { margin: 0; color: var(--ink); }
.alert-error { background: var(--red-100); border-color: #EFC2BA; }
.alert-error .ic { background: var(--red-600); }
.alert-success { background: var(--ok-100); border-color: #C4DFC0; }
.alert-success .ic { background: var(--ok-600); }
.alert-info { background: var(--lake-100); border-color: #BCD6E2; }
.alert-info .ic { background: var(--lake-600); }
.stat { padding: 18px 20px; }
.stat small { color: var(--gray-600); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.stat .v { font-size: 26px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
.stat .d { color: var(--gray-600); font-size: 12px; }
.grid { display: grid; gap: 20px; }
.g2 { grid-template-columns: 1fr 1fr; }
.g3 { grid-template-columns: repeat(3, 1fr); }
.g4 { grid-template-columns: repeat(4, 1fr); }
.side { grid-template-columns: 1.45fr 1fr; }
.side-r { grid-template-columns: 1fr 360px; }
.kv { display: grid; grid-template-columns: 140px 1fr; gap: 10px 16px; }
.kv dt { color: var(--gray-600); }
.kv dd { margin: 0; font-weight: 500; }
.note { position: relative; background: var(--gold-400); color: var(--ink); font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 6px; display: inline-block; }
.note.abs { position: absolute; z-index: 3; box-shadow: 0 2px 6px rgba(0,0,0,.15); }
.note::before { content: "✎ "; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px; background: var(--forest-100); color: var(--forest-700); font-weight: 500; font-size: 13px; }
.chip.y { background: var(--wood-100); color: #8A5A12; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--gray-600); }
.live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--gold-400); box-shadow: 0 0 0 3px rgba(95,211,154,.3); }
.skel { background: linear-gradient(90deg, var(--gray-200), #F0F5F3, var(--gray-200)); border-radius: 4px; height: 12px; }
.empty { text-align: center; padding: 40px 20px; color: var(--gray-600); }
.empty .ic { width: 52px; height: 52px; border-radius: 50%; background: var(--forest-100); margin: 0 auto 12px; display: grid; place-items: center; color: var(--forest-600); font-size: 22px; }
.empty b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 4px; }
.money { font-variant-numeric: tabular-nums; }
.stepper { display: flex; align-items: center; border: 1px solid var(--gray-300); border-radius: var(--radius-sm); height: 38px; background: #fff; }
.stepper span { width: 38px; text-align: center; color: var(--forest-600); font-weight: 700; font-size: 16px; }
.stepper b { flex: 1; text-align: center; border-left: 1px solid var(--gray-200); border-right: 1px solid var(--gray-200); line-height: 36px; }
.price-line { display: flex; justify-content: space-between; padding: 8px 0; color: var(--gray-600); }
.price-line.total { border-top: 1px dashed var(--gray-300); margin-top: 6px; padding-top: 12px; color: var(--ink); font-weight: 700; font-size: 16px; }
.balances { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
.balances .arrow { color: var(--gray-600); font-size: 20px; }
.balbox { border: 1px solid var(--gray-300); border-radius: var(--radius-sm); padding: 14px 16px; background: #fff; }
.balbox small { color: var(--gray-600); font-size: 12px; font-weight: 600; }
.balbox .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.balbox.after { border-color: var(--forest-600); background: var(--forest-100); }
.trigger-card { border: 1px solid #9FE3C0; background: var(--wood-100); border-left: 4px solid var(--gold-400); border-radius: var(--radius-sm); padding: 14px 16px; }
.trigger-card .t { flex-wrap: wrap; gap: 6px; display: flex; align-items: center; justify-content: space-between; font-weight: 700; margin-bottom: 10px; }
.trigger-card .kv { grid-template-columns: 120px 1fr; gap: 6px 12px; font-size: 13px; }
.booking-row { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--gray-200); }
.booking-row .meta { flex: 1; min-width: 0; }
.booking-row .meta b { display: block; overflow: hidden; text-overflow: ellipsis; }
.booking-row .meta small { color: var(--gray-600); }
.flow { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--gray-600); padding: 10px 20px; background: var(--sand-50); border-bottom: 1px solid var(--gray-200); }
.flow .badge { height: 20px; }
.map { position: relative; height: 560px; background: #E6F0EB; overflow: hidden; border-radius: 0 0 var(--radius) var(--radius); }
.map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.map .zoom { position: absolute; left: 14px; top: 14px; display: flex; flex-direction: column; background: #fff; border: 1px solid var(--gray-300); border-radius: 6px; }
.map .zoom span { width: 30px; height: 30px; display: grid; place-items: center; font-weight: 700; color: var(--ink); }
.map .zoom span + span { border-top: 1px solid var(--gray-300); }
.map .legend { position: absolute; right: 14px; bottom: 14px; background: #fff; border: 1px solid var(--gray-300); border-radius: 8px; padding: 10px 12px; font-size: 12px; display: grid; gap: 6px; }
.map .legend div { display: flex; align-items: center; gap: 8px; }
.dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.hot-list .item { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--gray-200); }
.hot-list .item.sel { background: var(--forest-100); box-shadow: inset 3px 0 0 var(--forest-600); }
.hot-list .rank { width: 26px; height: 26px; border-radius: 50%; background: var(--forest-100); color: var(--forest-700); display: grid; place-items: center; font-weight: 700; font-size: 12px; flex: none; }
.hot-list .item .meta { flex: 1; }
.hot-list .item small { color: var(--gray-600); display: block; }
.hot-list .item .km { font-weight: 700; font-variant-numeric: tabular-nums; }
.new-tag { background: var(--gold-400); color: var(--ink); font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px; margin-left: 6px; }
.bars .row { display: grid; grid-template-columns: 110px 1fr 56px; align-items: center; gap: 10px; margin: 9px 0; }
.bars .track { height: 18px; background: var(--sand-50); border-radius: 4px; overflow: hidden; }
.bars .fill { height: 100%; background: var(--lake-600); border-radius: 4px; }
.bars .fill.y { background: var(--star); }
.bars .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--gray-600); font-size: 13px; }
.stars { color: var(--star); letter-spacing: 2px; font-size: 20px; }
.stars .off { color: var(--gray-300); }
.amen-group h4 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--gray-600); display: flex; align-items: center; gap: 8px; }
.amen-group h4 i { width: 22px; height: 22px; border-radius: 6px; background: var(--forest-100); color: var(--forest-600); display: grid; place-items: center; font-style: normal; font-size: 12px; }
.amen-group ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.amen-group li { display: flex; align-items: center; gap: 8px; }
.amen-group li::before { content: "✓"; color: var(--ok-600); font-weight: 700; }
.amen-group.rules li::before { content: "!"; color: #8A5A12; background: var(--wood-100); width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; }
.legend-inline { display: flex; gap: 16px; font-size: 12px; color: var(--gray-600); }
.legend-inline span { display: inline-flex; align-items: center; gap: 6px; }
.legend-inline i { width: 14px; height: 4px; border-radius: 2px; display: inline-block; }
.rank-badge { width: 28px; height: 28px; border-radius: 50%; display: inline-grid; place-items: center; font-weight: 700; background: var(--forest-100); color: var(--forest-700); }
.rank-badge.top { background: var(--gold-400); color: var(--ink); }
.swatch { border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--gray-300); }
.swatch .c { height: 64px; }
.swatch .t { padding: 8px 10px; font-size: 12px; background: #fff; }
.swatch .t b { display: block; }
.swatch .t span { font-family: var(--mono); color: var(--gray-600); }
.type-row { display: flex; align-items: baseline; gap: 20px; padding: 8px 0; border-bottom: 1px solid var(--gray-200); }
.type-row small { width: 120px; color: var(--gray-600); font-family: var(--mono); font-size: 11px; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 14px; }
.muted { color: var(--gray-600); }
.spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; display: inline-block; }


/* ---------- Immersive layer: pine nav, hero band with mountain edge and villa art ---------- */
h2, .stat .v, .balbox .v, .brand, .card-h h3, .sheet > h1 { font-family: var(--display); letter-spacing: -.01em; }
.topnav { background: var(--forest-700); border-bottom: 0; }
.brand { color: #fff; font-weight: 800; }
.brand .mark { background: none; width: 34px; height: 26px; border-radius: 0; }
.brand .mark::after { content: none; }
.navlinks a { color: #B9D3CC; }
.navlinks a.on { color: var(--forest-700); background: var(--gold-400); box-shadow: none; border-radius: 999px; font-weight: 600; }
.actor { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.18); }
.actor b { color: #fff; } .actor small, .actor .chev { color: #9FC3B9; }
.avatar { background: var(--gold-400); color: var(--forest-700); }
.burger { border-color: rgba(255,255,255,.25); } .burger span { background: #fff; box-shadow: 0 5px 0 #fff, 0 -5px 0 #fff; }
.page-head { position: relative; margin: -28px -28px 0; padding: 40px 28px 104px; background: linear-gradient(160deg, var(--forest-600) 0%, #19433E 100%); color: #fff; overflow: hidden; min-height: 210px; align-items: flex-start; }
.page-head > * { position: relative; z-index: 2; }
.page-head h2 { color: #fff; font-size: 34px; font-weight: 800; line-height: 1.1; }
.page-head h2::after { content: ""; display: block; width: 48px; height: 4px; border-radius: 2px; background: var(--gold-400); margin-top: 12px; }
.page-head p { color: #B9D3CC; max-width: 560px; font-size: 15px; margin-top: 12px; }
.page-head p code { color: var(--gold-400); }
.page-head .crumbs { color: #9FC3B9; } .page-head .crumbs a { color: var(--gold-400); }
.page-head .field > span { color: #B9D3CC; }
.page-head .tabs { background: rgba(255,255,255,.1); } .page-head .tabs a { color: #DDF5E8; } .page-head .tabs a.on { background: var(--gold-400); color: var(--forest-700); }
.page-head .live { color: #DDF5E8; }
.page-head .btn-secondary { background: transparent; color: #fff; border-color: rgba(255,255,255,.35); }
.page-head .btn-primary { background: var(--gold-400); color: var(--forest-700); }
.page-head .chip.y { background: rgba(255,255,255,.12); color: #DDF5E8; }
.hero-art { position: absolute; right: 0; bottom: 40px; height: calc(100% - 52px); width: 520px; z-index: 1; pointer-events: none; }
.hero-edge { position: absolute; left: 0; right: 0; bottom: -1px; height: 64px; width: 100%; z-index: 1; }
.page-head + * { position: relative; z-index: 3; margin-top: -44px; }
.page-head.has-ctrl .hero-art { opacity: .35; }
.page-head ~ .stack, .page-head ~ .grid, .page-head ~ .card { position: relative; z-index: 3; }
.card { border-color: transparent; }
.card-h h3 { font-size: 17px; font-weight: 700; }
.trigger-card { background: #E9FAF1; border-color: #9FE3C0; border-left-color: var(--gold-400); }
.note { background: #FFE58A; color: var(--forest-700); }
.rank-badge.top { background: var(--gold-400); color: var(--forest-700); }
@container (max-width: 700px) {
  .page-head { margin: -16px -16px 0; padding: 28px 16px 76px; min-height: 0; }
  .page-head h2 { font-size: 26px; }
  .hero-art { width: 260px; opacity: .35; }
}

/* ---------- Narrow container (phone) ---------- */
@container (max-width: 700px) {

  .navlinks, .actor small, .actor .chev { display: none; }
  .brand { flex: 1; font-size: 16px; }
  .burger { display: grid; }
  .actor { padding: 2px; border: 0; }

  .page { padding: 16px; }

  .page-head h2 { font-size: 20px; }
  .side, .side-r, .g2, .g3, .g4 { grid-template-columns: minmax(0, 1fr); }

<body>
<div class="sheet" id="sheet">
  <h1>StaySpot: low-fidelity wireframes</h1>
  <p class="lead">Assignment 2, Step 2. Six windows plus the shared page frame, actor switcher and booking status changer. Every field shown comes from an endpoint in <code>docs/api_endpoints.md</code>; pale yellow notes name the endpoint or the database object behind each part.</p>
</div>

<script>
/* ---------- Sample data (shapes match docs/api_endpoints.md) ---------- */
const NAV = ["Browse", "Book a stay", "Audit trail", "Analytics", "Map", "Reviews"];
const inr = n => "₹" + n.toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const inr0 = n => "₹" + n.toLocaleString("en-IN");
const props = [
  ["Lakeview Heritage Villa", 12450, 17.4239, 78.4738],
  ["Banjara Hills Garden Loft", 6800, 17.4156, 78.4347],
  ["Charminar Courtyard Home", 3200, 17.3616, 78.4747],
  ["Jubilee Skyline Studio", 4750, 17.4326, 78.4071],
  ["Gachibowli Tech Suite", 5400, 17.4401, 78.3489],
  ["Golconda Fort Cottage", 2900, 17.3833, 78.4011],
  ["Hussain Sagar Penthouse", 18900, 17.4239, 78.4738],
  ["Secunderabad Family Flat", 3650, 17.4399, 78.4983],
];

function shell(active, url, body, opts = {}) {
  const links = NAV.map(n => `<a class="${n === active ? "on" : ""}">${n}</a>`).join("");
  return `
  <div class="chrome"><i></i><i></i><i></i><div class="url">${url}</div></div>
  <div class="topnav">
    <div class="burger"><span></span></div>
    <div class="brand"><div class="mark"></div>StaySpot</div>

    <div class="actor"><div class="avatar">PS</div><div><small>Acting as guest</small><b>Priya Sharma</b></div><span class="chev">▾</span></div>
  </div>
  <div class="page">${body}</div>`;
}

function frame(id, title, sub, html, phone = false) {
  const wrap = document.createElement("div");
  wrap.innerHTML = `<div class="label">${title} <span>· ${sub}</span></div><div class="frame${phone ? " phone" : ""}" id="${id}">${html}</div>`;
  document.getElementById("sheet").append(...wrap.childNodes);
}

/* ---------- 0. Style sheet ---------- */
const sw = [["Pine (primary)", "#1E4D47"], ["Pine dark", "#133A35"], ["Mint (accent)", "#5FD39A"], ["Mint light", "#DDF5E8"], ["Pool blue", "#2E8FB8"], ["Pool light", "#E1F1F8"], ["Mist (background)", "#F3F7F5"], ["Surface", "#FFFFFF"], ["Ink (text)", "#12302C"], ["Star gold", "#F2B544"], ["Amber light", "#FDF0D5"], ["Danger", "#C2412F"]];
frame("w00-style", "0. Style guide sheet", "Colours, type and the reusable components every screen is built from", `
  <div class="page">
  <div class="page-head"><div><h2>StaySpot look</h2><p>Deep pine and fresh mint, like a resort at dusk: pine for structure and action, mint for highlights, pool blue for data, on a soft mist background.</p></div></div>
  <div class="grid" style="grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:24px">${sw.map(c => `<div class="swatch"><div class="c" style="background:${c[1]}"></div><div class="t"><b>${c[0]}</b><span>${c[1]}</span></div></div>`).join("")}</div>

      <div class="type-row"><small>26 / 700</small><span style="font-size:26px;font-weight:700" class="money">₹61,070.00</span></div>
      <div class="type-row"><small>14 / 400</small><span>Body text for descriptions and table cells.</span></div>
      <div class="type-row"><small>12 / 600 caps</small><span style="font-size:12px;font-weight:600;color:var(--gray-600);text-transform:uppercase;letter-spacing:.04em">Label / table header</span></div>
      <div class="type-row" style="border:0"><small>JetBrains Mono</small><span class="mono">a71c4e02 · 409 ACTIVE_STAY_EXISTS</span></div>
    </div></div>
    <div class="card"><div class="card-h"><h3>Buttons, inputs, badges</h3></div><div class="card-b stack">
      <div class="row"><span class="btn btn-primary">Book stay</span><span class="btn btn-secondary">Clear filters</span><span class="btn btn-accent">↻ Refresh view</span><span class="btn btn-danger">↻ Retry</span><span class="btn btn-ghost">View →</span><span class="btn btn-primary" disabled><span class="spinner"></span> Booking…</span></div>
      <div class="grid g3" style="gap:12px"><label class="field"><span>Text</span><div class="input ph">⌕ Search…</div></label><label class="field"><span>Select</span><div class="input sel">Lakeview Villa</div></label><label class="field"><span>Focused</span><div class="input focus">villa</div></label></div>
      <div class="row">${badge("CONFIRMED")}${badge("CHECKED_IN")}${badge("COMPLETED")}${badge("DEBIT")}${badge("CREDIT")}<span class="chip">📶 WiFi</span><span class="live">Live</span></div>
      <div class="alert alert-success"><div class="ic">✓</div><div><b>Success alert</b><p>Result of an action that worked.</p></div></div>
      <div class="alert alert-error"><div class="ic">!</div><div><b>Error alert</b><p>Plain-language message from <code>error.message</code>.</p></div></div>
    </div></div>
  </div></div>
`.replace('<div class="page">', '<div class="chrome"><i></i><i></i><i></i><div class="url">docs/design/design_system.md</div></div><div class="page">'));

/* ---------- 1. Browse list ---------- */
const browseRows = props.concat([["Madhapur Lake Retreat", 7300, 17.4483, 78.3915], ["Begumpet Garden Suite", 4100, 17.4447, 78.4664]]).map((p, i) => `
  <tr class="${i === 2 ? "hover" : ""}">
    <td><b>${p[0]}</b><div class="mono">${["3f2a","9c41","b7e0","1d88","64af","e215","70bc","a9d3","c0f1","5e7a"][i]}…-4e1c</div></td>
    <td class="num money">${inr(p[1])}</td>
    <td class="num mono">${p[2].toFixed(4)}</td>
    <td class="num mono">${p[3].toFixed(4)}</td>
    <td class="num">${[214, 187, 162, 158, 141, 133, 129, 120, 98, 91][i]}</td>

frame("w01-browse-list", "1. Browse: list", "Properties tab; Guests and Bookings tabs use the same layout", shell("Browse", "stayspot.local/browse/properties?page=1&maxPrice=20000", `
  <div class="page-head">

  <div class="card" style="position:relative">
    <span class="note abs" style="right:16px;top:-12px">GET /properties?page&limit&q&minPrice&maxPrice</span>

      <label class="field" style="flex:1 1 320px"><span>Search by title</span><div class="input focus ph">⌕ Search properties by title…</div></label>

      <label class="field" style="width:160px"><span>Max price / night</span><div class="input">₹ 20,000</div></label>
      <span class="btn btn-secondary">Clear filters</span>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>Property</th><th class="num">Base price / night</th><th class="num">Latitude</th><th class="num">Longitude</th><th class="num">Bookings</th><th></th></tr></thead>

`));

/* ---------- 2. Browse detail ---------- */
const detailBookings = [
  ["Priya Sharma", 3, 37350, "CHECKED_IN", "12 Oct 2026"],
  ["Arjun Mehta", 2, 24900, "CONFIRMED", "11 Oct 2026"],
  ["Sara Thomas", 5, 62250, "COMPLETED", "02 Oct 2026"],
  ["Kabir Rao", 1, 12450, "COMPLETED", "28 Sep 2026"],

].map(b => `<tr><td>${b[0]}</td><td class="num">${b[1]}</td><td class="num money">${inr(b[2])}</td><td>${badge(b[3])}</td><td class="muted">${b[4]}</td></tr>`).join("");
function badge(s) { const m = { CONFIRMED: "b-confirmed", CHECKED_IN: "b-checkedin", COMPLETED: "b-completed", DEBIT: "b-debit", CREDIT: "b-credit" }; return `<span class="badge ${m[s]}">${s.replace("_", " ")}</span>`; }

/* ---------- 3. Transaction (success) ---------- */
function bookingPanel(err) {
  const rows = [
    ["Lakeview Heritage Villa", "#a71c… · 3 nights · " + inr(37350), "CONFIRMED", `<span class="btn btn-primary btn-sm">Check in</span>`, true],

  ];
  return `<div class="card" style="position:relative">

  return `<div class="card" style="position:relative">

    <div class="card-h"><h3>Book a stay</h3><span class="sub">Guest: Priya Sharma</span></div>
    <div class="card-b stack">
      <label class="field"><span>Property</span><div class="input sel">Lakeview Heritage Villa · ${inr0(12450)}/night</div></label>
      <label class="field"><span>Nights</span><div class="stepper"><span>−</span><b>3</b><span>+</span></div></label>

        <div class="price-line"><span>${inr(12450)} × 3 nights</span><span class="money">${inr(37350)}</span></div>
        <div class="price-line"><span>Wallet balance</span><span class="money ${bal < 37350 ? "neg" : ""}">${inr(bal)}</span></div>

function maChart() {
  const W = 760, H = 260, pl = 56, pr = 16, pt = 16, pb = 30, n = 30;
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const daily = Array.from({ length: n }, (_, i) => Math.round(18000 + 14000 * Math.sin(i / 4) + rnd() * 26000));
  daily[9] = 0; daily[20] = 0;
  const ma = daily.map((_, i) => daily.slice(Math.max(0, i - 6), i + 1).reduce((a, b) => a + b, 0) / 7);
  const max = 70000, x = i => pl + (i + .5) * (W - pl - pr) / n, y = v => pt + (H - pt - pb) * (1 - v / max);
  const bw = (W - pl - pr) / n * .62;
  let g = "";
  for (let v = 0; v <= max; v += 17500) g += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="#E3ECE8"/><text x="${pl - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#5D716D">₹${v / 1000}k</text>`;
  const bars = daily.map((d, i) => `<rect x="${x(i) - bw / 2}" y="${y(d)}" width="${bw}" height="${y(0) - y(d)}" rx="2" fill="#2E8FB8" opacity=".22"/>`).join("");
  const line = ma.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(" ");
  const labels = [0, 7, 14, 21, 29].map(i => `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="#5D716D">${["14 Sep", "21 Sep", "28 Sep", "05 Oct", "13 Oct"][[0, 7, 14, 21, 29].indexOf(i)]}</text>`).join("");
  const hi = 24;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${g}${bars}<path d="${line}" fill="none" stroke="#1E4D47" stroke-width="2.5" stroke-linejoin="round"/>${labels}
    <line x1="${x(hi)}" x2="${x(hi)}" y1="${pt}" y2="${y(0)}" stroke="#12302C" stroke-dasharray="3 3" opacity=".4"/>
    <circle cx="${x(hi)}" cy="${y(ma[hi])}" r="5" fill="#5FD39A" stroke="#12302C" stroke-width="1.5"/>
    <g transform="translate(${x(hi) - 168},${y(ma[hi]) - 64})"><rect width="156" height="52" rx="6" fill="#12302C"/><text x="10" y="18" font-size="11" fill="#A9DCC4">08 Oct 2026</text><text x="10" y="34" font-size="12" fill="#fff">Daily: ${inr0(daily[hi])}</text><text x="10" y="47" font-size="12" fill="#5FD39A">7-day avg: ${inr0(Math.round(ma[hi]))}</text></g></svg>`;
}
